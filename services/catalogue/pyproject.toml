[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gallery-catalogue"
version = "0.1.0"
description = "Gallery-owned local collection ingestion and durable canonical catalogue"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "jsonschema>=4,<5"]

[project.scripts]
gallery-catalogue = "catalogue_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
