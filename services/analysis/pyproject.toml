[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ollamabinsaden-analysis"
version = "1.0.0"
description = "Local, versioned visual analysis for canonical assets"
requires-python = ">=3.12"
dependencies = ["Pillow>=10,<12"]

[project.optional-dependencies]
runtime = ["torch>=2.4,<3", "torchvision>=0.19,<1"]
ocr = ["pytesseract>=0.3.10,<1"]
test = ["mypy>=1.11,<2", "pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
ollamabinsaden-analysis = "analysis_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "torch", "torch.*", "torchvision", "torchvision.*", "pytesseract"]
ignore_missing_imports = true
