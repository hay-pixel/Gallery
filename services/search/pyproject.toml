[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ollamabinsaden-search"
version = "1.0.0"
description = "Persistent provider-independent visual similarity search"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["mypy>=1.11,<2", "pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
ollamabinsaden-search = "search_service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
