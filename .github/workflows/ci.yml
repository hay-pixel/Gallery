name: Gallery CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gallery
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/gallery/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec eslint .
      - run: pnpm test
      - run: pnpm build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'services/analysis[test]' -e 'services/search[test]' -e 'services/catalogue[test]'
      - run: pytest services/analysis/tests services/search/tests services/catalogue/tests tests/integration
      - run: ruff check services/catalogue
      - run: mypy --strict services/catalogue/src
